name: Security regression checks

on:
  push:
    branches: [master, security-audit/**]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
      - name: Enable pinned Yarn
        run: corepack enable
      - name: Install locked dependencies
        run: yarn install --frozen-lockfile
      - name: Run lint, typecheck, Jest tests, production build, and import checks
        run: make verify
      - name: Check production dependency advisories
        run: yarn audit --groups dependencies
